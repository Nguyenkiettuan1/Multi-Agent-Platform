name: general-assistant
description: Versatile assistant — Q&A, writing, explanations (GPT-like)
version: "1.0"
enabled: true

agents:
  - general-agent

triggers:
  - giải thích
  - explain
  - viết
  - write
  - tóm tắt
  - summarize
  - là gì
  - what is
  - how to
  - brainstorm

model_tier: T1
max_context_tokens: 8192

tags:
  - general

settings:
  default_language: vi
  tone: professional
