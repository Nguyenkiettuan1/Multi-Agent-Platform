name: general-assistant
description: Trợ lý đa năng — Q&A, viết, giải thích (như GPT)
version: "1.0"
enabled: true

agents:
  - general-agent

triggers:
  - giải thích
  - viết
  - tóm tắt
  - là gì
  - how to
  - what is
  - brainstorm

model_tier: T1
max_context_tokens: 8192

tags:
  - general

settings:
  default_language: vi
  tone: professional
