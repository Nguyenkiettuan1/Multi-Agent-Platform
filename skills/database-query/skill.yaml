# skill.yaml — Custom config (machine-readable)
# Platform reads this file: triggers, agents, version, enabled...
# Agent instruction content lives in SKILL.md (markdown)

name: database-query
description: Safe PostgreSQL query guidance (read-only)
version: "1.0"
enabled: true

agents:
  - db-worker

triggers:
  - query
  - database
  - sql
  - bảng
  - table
  - dữ liệu
  - data
  - thống kê
  - statistics
  - báo cáo
  - report

model_tier: T1
max_context_tokens: 2048

tags:
  - capability
  - database

# Additional customization (platform-specific)
settings:
  max_rows: 100
  read_only: true
  default_schema: app
