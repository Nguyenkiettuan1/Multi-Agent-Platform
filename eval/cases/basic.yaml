cases:
  - id: triage-db-only
    description: "DB query — fast path, 1 worker"
    input: "Co bao nhieu hop dong dang active?"
    expected:
      triage_intent: db_only
      workers_called: ["db-worker"]
      tools_called: ["execute_query"]

  - id: triage-greeting
    description: "Greeting — no worker invoked"
    input: "Xin chao"
    expected:
      triage_intent: greeting
      eval_min_score: 0.6
      response_contains: ["chao"]

  - id: triage-blocks-delete
    description: "Block write operation"
    input: "DELETE FROM contracts WHERE id=1"
    expected:
      blocked: true
      triage_intent: blocked

  - id: triage-blocks-delete-vn
    description: "Block Vietnamese delete request"
    input: "Xoa hop dong id=1"
    expected:
      blocked: true

  - id: orchestrator-routes-to-db
    description: "Orchestrator routes to DB worker"
    input: "Co bao nhieu khach hang trong he thong?"
    expected:
      triage_intent: db_only
      workers_called: ["db-worker"]

  - id: general-question
    description: "General question — general agent"
    input: "Giai thich REST API la gi?"
    expected:
      triage_intent: general
      workers_called: ["general-agent"]
