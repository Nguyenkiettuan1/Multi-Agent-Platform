# Agent Fleet Registry
# Ref: OpenAI Agents SDK, Anthropic agents, CrewAI
#
# Pattern: agent.model maps to a model profile or deployment ref
# Values: profile alias (balanced) or model ref (or-claude-sonnet)

agents:
  - id: general-agent
    name: General Assistant
    description: >
      Versatile assistant — explain, write, brainstorm, Q&A, summarize.
      Use for any request that does NOT require DB query, document search, or actions.
    skills:
      - general-assistant
    tools: []
    model: balanced
    model_fallbacks: [or-gpt-4o-mini]

  - id: db-worker
    name: DB Worker
    description: >
      Read-only PostgreSQL queries — metrics, records, statistics, reports.
    skills:
      - database-query
    tools:
      - sql-mcp
    model: cheap
    model_fallbacks: [or-gpt-4o-mini]

  - id: research-worker
    name: Research Worker
    description: >
      Information search — internal documents, knowledge base, web search.
    skills:
      - document-research
    tools:
      - search-mcp
    model: balanced
    model_fallbacks: [or-gemini-flash]

  - id: legal-agent
    name: Legal Domain Agent
    description: >
      LEGAL domain expert — look up regulations, clauses, contract analysis.
      Use ONLY when the request is legally related.
    skills:
      - legal-research
    tools:
      - search-mcp
    model: or-claude-sonnet
    model_fallbacks: [or-gemini-flash]
    domain: legal

  - id: action-worker
    name: Action Worker
    description: >
      Execute MCP tools — translate, OCR, merge images, fetch URL, send email/API.
    skills: []
    tools:
      - builtin-translate
      - builtin-ocr
      - builtin-image
      - search-server
      - fetch
      - paddleocr
    model: fast

  - id: code-worker
    name: Code Worker
    description: >
      Write/run code, ETL, data transforms (Phase 2+).
    skills: []
    tools:
      - code-interpreter
    model: balanced
    enabled: false

  - id: default-agent
    name: Default Agent
    description: Fallback when no agent matches.
    skills: []
    tools: []
    model: fast
